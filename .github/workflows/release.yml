name: release
on:
  push:
    branches:
      - workflows

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install dependencies
        run: uv sync
      - name: Run the build script
        run: uv run build.py
      - name: Build a ZIP archive
        run: Compress-Archive -Path ./dist/vadim-clicker.dist/* -Destination VadimsClicker.zip