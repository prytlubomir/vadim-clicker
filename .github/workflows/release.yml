name: release
on:
  push:
    branches:
      - workflows

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install dependencies
        run: uv sync
      - name: Build GUI with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: gui.py
          mode: standalone
          include-data-files: ./vadimsclicker.kv=vadimsclicker.kv
          include-data-dir: |
            ./src=src
            ./uix=uix
          output-dir: ./dist
          windows-console-mode: disable
          windows-icon-from-ico: ./design/logo.png
      - name: Build TUI with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: tui.py
          mode: standalone
          include-data-files: ./src/ascii.txt=src/ascii
          output-dir: ./dist
          windows-console-mode: force
          windows-icon-from-ico: ./design/logo.png
      - name: Rename dist directory
        run: rni ./dist/gui.dist ./dist/vadim-clicker.dist
      - name: Move TUI binary
        run: mv ./dist/tui.dist/tui.exe', './dist/vadim-clicker.dist/tui.exe'
      - name: Build a ZIP archive
        run: Compress-Archive -Path ./dist/vadim-clicker.dist/* -Destination VadimsClicker.zip
      - name: Get commit message first line
        id: message_first_line
        shell: pwsh
        env:
          INPUT: ${{ github.event.head_commit.message }}
        run: |
          $firstLine = (([string]$env:INPUT) -split '\r?\n', 2)[0].Trim()
          "first_line=$firstLine" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: draft-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.message_first_line.outputs.first_line }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          prerelease: false
          files: VadimsClicker.zip
          fail_on_unmatched_files: true
