name: release
on:
  push:
    branches:
      - workflows

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install dependencies
        run: uv sync
      - name: Run the build script
        run: uv run build.py
      - name: Build a ZIP archive
        run: Compress-Archive -Path uix/* -Destination VadimsClicker.zip
      - name: Get commit message first line
        id: message_first_line
        shell: pwsh
        env:
          INPUT: ${{ github.event.head_commit.message }}
        run: |
          $firstLine = (([string]$env:INPUT) -split '\r?\n', 2)[0].Trim()
          "first_line=$firstLine" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: draft-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.message_first_line.outputs.first_line }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          prerelease: false
          files: VadimsClicker.zip
          fail_on_unmatched_files: true
