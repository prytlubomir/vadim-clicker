name: release
on:
  push:
    branches:
      - workflows

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install dependencies
        run: uv sync
      - name: Run the build script
        run: uv run build.py
      - name: Build a ZIP archive
        run: Compress-Archive -Path ./dist/vadim-clicker.dist/* -Destination VadimsClicker.zip
      - name: Get commit message first line
        id: message_first_line
        shell: pwsh
        env:
          INPUT: ${{ github.event.head_commit.message }}
        run: |
          $firstLine = (([string]$env:INPUT) -split '\r?\n', 2)[0].Trim()
          "first_line=$firstLine" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.message_first_line.outputs.firstline }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: VadimsClicker.zip
          asset_name: VadimsClicker.zip
          asset_content_type: application/zip      
